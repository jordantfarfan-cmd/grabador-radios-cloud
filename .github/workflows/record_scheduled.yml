        with:
          name: Audio_PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}
          path: final_audios/PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore

      - name: Auto-Subir crudos en Privado a YouTube (para revisión de copyright)
        if: env.LOGICAL_DATE != ''
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          YT_TOKEN_3: ${{ secrets.YT_TOKEN_3 }}
          YT_TOKEN_4: ${{ secrets.YT_TOKEN_4 }}
        run: python3 scripts/auto_upload.py
      - name: Subir marcador RawVideo MODA
        if: always() && env.RAW_ARTIFACT_MODA_EL_JUERGON_DE_MODA != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_MODA_EL_JUERGON_DE_MODA }}
