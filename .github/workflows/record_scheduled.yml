        with:
          name: Preview_ONDA_CERO_LA_HORA_REMIX__${{ env.LOGICAL_DATE }}
          path: previews/ONDA_CERO_LA_HORA_REMIX__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore

      - name: Subir Preview LA ZONA ZONA WEEKEND
        if: env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_LA_ZONA_ZONA_WEEKEND__${{ env.LOGICAL_DATE }}
          path: previews/LA_ZONA_ZONA_WEEKEND__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore

      - name: Subir Preview LA ZONA ZONA WEEKEND CLASICOS DEL REGGAETON
        if: env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_LA_ZONA_ZONA_WEEKEND_CLASICOS_DEL_REGGAETON__${{ env.LOGICAL_DATE }}
