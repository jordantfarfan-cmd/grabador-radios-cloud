name: "Grabación Automática de Radios (Híbrido: Auto-Subida + Plan B)"

on:
  schedule:
    # Respaldo automático en minutos sin congestión (Cloudflare Cron dispara 10-13 min antes)
    # Lima = UTC - 5 horas
    # 1) Lun-Vie 12:00 PM Lima -> 16:37 UTC (11:37 AM Lima)
    - cron: '37 16 * * 1-5'
    # 2) Viernes 3:00 PM Lima -> 19:37 UTC (2:37 PM Lima)
    - cron: '37 19 * * 5'
    # 3) Vie-Sáb Viva FM + Sáb Modo Latin -> 23:38 UTC (6:38 PM Lima)
    - cron: '38 23 * * 5,6'
    # 4) Sáb-Dom Noche (desde 6:00 PM Lima) -> 22:33 UTC (5:33 PM Lima)
    - cron: '33 22 * * 6,0'
    # 5) Viernes Noche + Cierre Medianoche -> 00:37 UTC Sábado (7:37 PM Lima Vie)
    - cron: '37 0 * * 6'
    # 6) Sábado Cierre Medianoche (Panamix Noche) -> 02:42 UTC Domingo (9:42 PM Lima Sáb)
    - cron: '42 2 * * 0'

  workflow_dispatch:
    inputs:
      window:
        description: "Ventana a ejecutar manualmente"
        required: true
        type: choice
        options:
          - night
          - daytime_12
          - daytime_15
          - viva_night
          - night_early_20
          - night_mid_24
      override_day:
        description: "Forzar día (0=Dom, 1=Lun, ..., 5=Vie, 6=Sáb, -1=Hoy automático Lima)"
        required: false
        default: "-1"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  # =========================================================================
  # VENTANA DÍA 12 PM (Lun-Vie: Panamericana Panamix) - Con VPN Failover
  # =========================================================================
  daytime_12:
    if: github.event.schedule == '37 16 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.window == 'daytime_12')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evitar duplicado si ya corre otro runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_duplicate_job.py
      - name: Instalar ffmpeg, wireproxy y librerías YouTube
        if: env.ALREADY_RUNNING != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy && sudo mv wireproxy /usr/local/bin/wireproxy && rm -f wireproxy.tar.gz
      - name: Grabar daytime_12 con VPN Failover y generar preview
        if: env.ALREADY_RUNNING != 'true'
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_WG_CONF }}
          PROTON_WG_CONF_2: ${{ secrets.PROTON_WG_CONF_2 }}
          PROTON_WG_CONF_3: ${{ secrets.PROTON_WG_CONF_3 }}
          PROTON_WG_CONF_4: ${{ secrets.PROTON_WG_CONF_4 }}
          PROTON_WG_CONF_5: ${{ secrets.PROTON_WG_CONF_5 }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window daytime_12 --override-day "$OVERRIDE"
          python3 scripts/finalize_audio.py
      - name: Subir Preview Día 12
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Previews_Dia12__${{ env.LOGICAL_DATE }}
          path: previews/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio Panamericana Día (Respaldo 3 días)
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}
          path: final_audios/PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Auto-Subir crudo en Privado a YouTube
        if: env.LOGICAL_DATE != ''
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          YT_TOKEN_3: ${{ secrets.YT_TOKEN_3 }}
          YT_TOKEN_4: ${{ secrets.YT_TOKEN_4 }}
        run: python3 scripts/auto_upload.py
      - name: Subir marcador RawVideo Panamix
        if: always() && env.RAW_ARTIFACT_PANAMERICANA_PANAMIX != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_PANAMERICANA_PANAMIX }}
          path: ${{ env.RAW_PATH_PANAMERICANA_PANAMIX }}/
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # VENTANA DÍA 3 PM (Viernes: La Zona Clásicos) - Con VPN Failover
  # =========================================================================
  daytime_15:
    if: github.event.schedule == '37 19 * * 5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.window == 'daytime_15')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evitar duplicado si ya corre otro runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_duplicate_job.py
      - name: Instalar ffmpeg, wireproxy y librerías YouTube
        if: env.ALREADY_RUNNING != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy && sudo mv wireproxy /usr/local/bin/wireproxy && rm -f wireproxy.tar.gz
      - name: Grabar daytime_15 con VPN Failover y generar preview
        if: env.ALREADY_RUNNING != 'true'
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_WG_CONF }}
          PROTON_WG_CONF_2: ${{ secrets.PROTON_WG_CONF_2 }}
          PROTON_WG_CONF_3: ${{ secrets.PROTON_WG_CONF_3 }}
          PROTON_WG_CONF_4: ${{ secrets.PROTON_WG_CONF_4 }}
          PROTON_WG_CONF_5: ${{ secrets.PROTON_WG_CONF_5 }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window daytime_15 --override-day "$OVERRIDE"
          python3 scripts/finalize_audio.py
      - name: Subir Preview Día 15
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Previews_Dia15__${{ env.LOGICAL_DATE }}
          path: previews/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio La Zona Clásicos 3PM (Respaldo 3 días)
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_LA_ZONA_CLASICOS_DEL_REGGAETON__${{ env.LOGICAL_DATE }}
          path: final_audios/LA_ZONA_CLASICOS_DEL_REGGAETON__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Auto-Subir crudo en Privado a YouTube
        if: env.LOGICAL_DATE != ''
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          YT_TOKEN_3: ${{ secrets.YT_TOKEN_3 }}
          YT_TOKEN_4: ${{ secrets.YT_TOKEN_4 }}
        run: python3 scripts/auto_upload.py
      - name: Subir marcador RawVideo La Zona 3PM
        if: always() && env.RAW_ARTIFACT_LA_ZONA_CLASICOS_DEL_REGGAETON != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_LA_ZONA_CLASICOS_DEL_REGGAETON }}
          path: ${{ env.RAW_PATH_LA_ZONA_CLASICOS_DEL_REGGAETON }}/
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # VENTANA VIVA FM NOCHE (Vie-Sáb 7 PM - 12 AM) - Directo sin VPN
  # =========================================================================
  viva_night:
    if: github.event.schedule == '38 23 * * 5,6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.window == 'viva_night')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evitar duplicado si ya corre otro runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_duplicate_job.py
      - name: Instalar ffmpeg y librerías YouTube
        if: env.ALREADY_RUNNING != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-auth google-auth-oauthlib google-api-python-client
      - name: Grabar Viva FM directo y generar preview
        if: env.ALREADY_RUNNING != 'true'
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window viva_night --override-day "$OVERRIDE"
          python3 scripts/finalize_audio.py
      - name: Subir Preview Viva FM
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Previews_VivaFM__${{ env.LOGICAL_DATE }}
          path: previews/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio Viva FM Fiesta Privada (Respaldo 3 días)
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_VIVA_FM_FIESTA_PRIVADA__${{ env.LOGICAL_DATE }}
          path: final_audios/VIVA_FM_FIESTA_PRIVADA__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Auto-Subir crudo en Privado a YouTube
        if: env.LOGICAL_DATE != ''
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          YT_TOKEN_3: ${{ secrets.YT_TOKEN_3 }}
          YT_TOKEN_4: ${{ secrets.YT_TOKEN_4 }}
        run: python3 scripts/auto_upload.py
      - name: Subir marcador RawVideo Viva FM
        if: always() && env.RAW_ARTIFACT_VIVA_FM_FIESTA_PRIVADA != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_VIVA_FM_FIESTA_PRIVADA }}
          path: ${{ env.RAW_PATH_VIVA_FM_FIESTA_PRIVADA }}/
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # SÁBADO TEMPRANO (Modo Latin 7-8 PM) - Cuenta VPN B independiente (sube ~8:05 PM)
  # =========================================================================
  night_early_20:
    if: github.event.schedule == '38 23 * * 5,6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.window == 'night_early_20')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evitar duplicado si ya corre otro runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_duplicate_job.py
      - name: Instalar ffmpeg, wireproxy y librerías YouTube
        if: env.ALREADY_RUNNING != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy && sudo mv wireproxy /usr/local/bin/wireproxy && rm -f wireproxy.tar.gz
      - name: Grabar Modo Latin con Cuenta VPN B y generar preview
        if: env.ALREADY_RUNNING != 'true'
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_B_WG_CONF }}
          PROTON_WG_CONF_2: ${{ secrets.PROTON_B_WG_CONF_2 }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window night_early_20 --override-day "$OVERRIDE"
          python3 scripts/finalize_audio.py
      - name: Subir Preview STUDIO MODO LATIN
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_STUDIO_MODO_LATIN__${{ env.LOGICAL_DATE }}
          path: previews/STUDIO_MODO_LATIN__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio STUDIO MODO LATIN (Respaldo 3 días)
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_STUDIO_MODO_LATIN__${{ env.LOGICAL_DATE }}
          path: final_audios/STUDIO_MODO_LATIN__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Auto-Subir crudo en Privado a YouTube
        if: env.LOGICAL_DATE != ''
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          YT_TOKEN_3: ${{ secrets.YT_TOKEN_3 }}
          YT_TOKEN_4: ${{ secrets.YT_TOKEN_4 }}
        run: python3 scripts/auto_upload.py
      - name: Subir marcador RawVideo Modo Latin
        if: always() && env.RAW_ARTIFACT_STUDIO_MODO_LATIN != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_STUDIO_MODO_LATIN }}
          path: ${{ env.RAW_PATH_STUDIO_MODO_LATIN }}/
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # NOCHE CIERRE MEDIANOCHE (Vie: Sessions+Oxígeno | Sáb: Panamix) - Cuenta VPN B
  # =========================================================================
  night_mid_24:
    if: github.event.schedule == '37 0 * * 6' || github.event.schedule == '42 2 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.window == 'night_mid_24')
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evitar duplicado si ya corre otro runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_duplicate_job.py
      - name: Instalar ffmpeg, wireproxy y librerías YouTube
        if: env.ALREADY_RUNNING != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy && sudo mv wireproxy /usr/local/bin/wireproxy && rm -f wireproxy.tar.gz
      - name: Grabar cierre Medianoche con Cuenta VPN B y generar preview
        if: env.ALREADY_RUNNING != 'true'
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_B_WG_CONF }}
          PROTON_WG_CONF_2: ${{ secrets.PROTON_B_WG_CONF_2 }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window night_mid_24 --override-day "$OVERRIDE"
          python3 scripts/finalize_audio.py
      - name: Subir Preview STUDIO SESSIONS
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_STUDIO_SESSIONS__${{ env.LOGICAL_DATE }}
          path: previews/STUDIO_SESSIONS__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio STUDIO SESSIONS
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_STUDIO_SESSIONS__${{ env.LOGICAL_DATE }}
          path: final_audios/STUDIO_SESSIONS__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Preview OXIGENO BAR OXIGENO
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_OXIGENO_BAR_OXIGENO__${{ env.LOGICAL_DATE }}
          path: previews/OXIGENO_BAR_OXIGENO__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio OXIGENO BAR OXIGENO
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_OXIGENO_BAR_OXIGENO__${{ env.LOGICAL_DATE }}
          path: final_audios/OXIGENO_BAR_OXIGENO__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Preview PANAMERICANA PANAMIX (Noche)
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}
          path: previews/PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir Audio PANAMERICANA PANAMIX (Noche)
        if: always() && env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Audio_PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}
          path: final_audios/PANAMERICANA_PANAMIX__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Auto-Subir crudo en Privado a YouTube
        if: env.LOGICAL_DATE != ''
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
          YT_TOKEN_3: ${{ secrets.YT_TOKEN_3 }}
          YT_TOKEN_4: ${{ secrets.YT_TOKEN_4 }}
        run: python3 scripts/auto_upload.py
      - name: Subir marcador RawVideo STUDIO SESSIONS
        if: always() && env.RAW_ARTIFACT_STUDIO_SESSIONS != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_STUDIO_SESSIONS }}
          path: ${{ env.RAW_PATH_STUDIO_SESSIONS }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir marcador RawVideo OXIGENO BAR OXIGENO
        if: always() && env.RAW_ARTIFACT_OXIGENO_BAR_OXIGENO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_OXIGENO_BAR_OXIGENO }}
          path: ${{ env.RAW_PATH_OXIGENO_BAR_OXIGENO }}/
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir marcador RawVideo PANAMIX Noche
        if: always() && env.RAW_ARTIFACT_PANAMERICANA_PANAMIX != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_PANAMERICANA_PANAMIX }}
          path: ${{ env.RAW_PATH_PANAMERICANA_PANAMIX }}/
          retention-days: 3
          if-no-files-found: ignore

  # =========================================================================
  # NOCHE BLOQUE 1 (Hasta 10:50 PM Lima) - Con VPN Failover Activo
  # =========================================================================
  night_block_1:
    if: github.event.schedule == '33 22 * * 6,0' || github.event.schedule == '37 0 * * 6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.window == 'night')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      skip_duplicate: ${{ steps.dup.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evitar duplicado si ya corre otro runner
        id: dup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_duplicate_job.py
      - name: Instalar ffmpeg y wireproxy
        if: env.ALREADY_RUNNING != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy && sudo mv wireproxy /usr/local/bin/wireproxy && rm -f wireproxy.tar.gz
      - name: Capturar Bloque 1 Noche con VPN Failover
        if: env.ALREADY_RUNNING != 'true'
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_WG_CONF }}
          PROTON_WG_CONF_2: ${{ secrets.PROTON_WG_CONF_2 }}
          PROTON_WG_CONF_3: ${{ secrets.PROTON_WG_CONF_3 }}
          PROTON_WG_CONF_4: ${{ secrets.PROTON_WG_CONF_4 }}
          PROTON_WG_CONF_5: ${{ secrets.PROTON_WG_CONF_5 }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window night_block_1 --override-day "$OVERRIDE"
      - name: Subir partes temporales Bloque 1
        if: always() && env.ALREADY_RUNNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tmp-night-part1-${{ github.run_id }}
          path: captured/
          retention-days: 1
          if-no-files-found: ignore

  # =========================================================================
  # NOCHE BLOQUE 2 (10:50 PM Lima -> 4:02 AM Lima) - Con VPN Failover Activo
  # =========================================================================
  night_block_2:
    needs: night_block_1
    if: always() && needs.night_block_1.outputs.skip_duplicate != 'true' && (needs.night_block_1.result == 'success' || needs.night_block_1.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar ffmpeg y wireproxy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz && chmod +x wireproxy && sudo mv wireproxy /usr/local/bin/wireproxy && rm -f wireproxy.tar.gz
      - name: Capturar Bloque 2 Noche con VPN Failover
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_WG_CONF }}
          PROTON_WG_CONF_2: ${{ secrets.PROTON_WG_CONF_2 }}
          PROTON_WG_CONF_3: ${{ secrets.PROTON_WG_CONF_3 }}
          PROTON_WG_CONF_4: ${{ secrets.PROTON_WG_CONF_4 }}
          PROTON_WG_CONF_5: ${{ secrets.PROTON_WG_CONF_5 }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_day || '-1' }}"
          python3 scripts/capture_block.py --window night_block_2 --override-day "$OVERRIDE"
      - name: Subir partes temporales Bloque 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-night-part2-${{ github.run_id }}
          path: captured/
          retention-days: 1
          if-no-files-found: ignore

  # =========================================================================
  # CONSOLIDACIÓN NOCHE: Guarda Respaldos (3 días) + Auto-Sube crudos en Privado
  # =========================================================================
  night_finalize:
    needs: [night_block_1, night_block_2]
    if: always() && needs.night_block_1.outputs.skip_duplicate != 'true' && (needs.night_block_1.result == 'success' || needs.night_block_2.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar ffmpeg y librerías YouTube
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-auth google-auth-oauthlib google-api-python-client
      - name: Descargar partes de Bloque 1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tmp-night-part1-${{ github.run_id }}
          path: captured
      - name: Descargar partes de Bloque 2
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tmp-night-part2-${{ github.run_id }}
          path: captured
      - name: Consolidar audios y generar Previews MP3 (1 hora)
        run: python3 scripts/finalize_audio.py

      - name: Subir Preview MODA EL JUERGON DE MODA
        if: env.LOGICAL_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Preview_MODA_EL_JUERGON_DE_MODA__${{ env.LOGICAL_DATE }}
          path: previews/MODA_EL_JUERGON_DE_MODA__${{ env.LOGICAL_DATE }}/
          retention-days: 3
          if-no-files-found: ignore

      - name: Subir Preview PLANETA PLANETA WEEKEND
