name: "Grabador Show Extendido (6 a 10 Horas)"

on:
  schedule:
    # Sábados y Domingos a las 06:00 PM Lima (23:00 UTC)
    - cron: '0 23 * * 6,0'
  workflow_dispatch:
    inputs:
      show_name:
        description: 'Nombre del show extendido'
        required: true
        default: 'LA ZONA ZONA WEEKEND CLASICOS DEL REGGAETON'
      block1_seconds:
        description: 'Duración del Bloque 1 en segundos (ej. 10800 = 3h)'
        required: true
        default: '10800'
      block2_seconds:
        description: 'Duración del Bloque 2 en segundos (ej. 10800 = 3h)'
        required: true
        default: '10800'

jobs:
  block_1:
    name: "Bloque 1: Captura Inicial"
    runs-on: ubuntu-latest
    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Instalar FFmpeg"
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: "Grabar Bloque 1 (formato .ts)"
        run: |
          mkdir -p partes
          STREAM_URL="https://mdstrm.com/audio/5fada54116646e098d97e6a5/icecast.audio"
          DURACION="${{ inputs.block1_seconds || '10800' }}"
          echo "Grabando Bloque 1 por ${DURACION}s..."
          ffmpeg -y -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000 \
            -i "$STREAM_URL" -t "$DURACION" -c:a copy -f mpegts partes/parte_001.ts

      - name: "Subir Artefacto Bloque 1 (1 día)"
        uses: actions/upload-artifact@v4
        with:
          name: "bloque1-audio"
          path: partes/parte_001.ts
          retention-days: 1

  block_2:
    name: "Bloque 2: Captura Final"
    needs: block_1
    runs-on: ubuntu-latest
    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Instalar FFmpeg"
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: "Grabar Bloque 2 (formato .ts)"
        run: |
          mkdir -p partes
          STREAM_URL="https://mdstrm.com/audio/5fada54116646e098d97e6a5/icecast.audio"
          DURACION="${{ inputs.block2_seconds || '10800' }}"
          echo "Grabando Bloque 2 por ${DURACION}s..."
          ffmpeg -y -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000 \
            -i "$STREAM_URL" -t "$DURACION" -c:a copy -f mpegts partes/parte_002.ts

      - name: "Subir Artefacto Bloque 2 (1 día)"
        uses: actions/upload-artifact@v4
        with:
          name: "bloque2-audio"
          path: partes/parte_002.ts
          retention-days: 1

  merge_and_upload:
    name: "Unión y Subida a Drive"
    needs: [block_1, block_2]
    runs-on: ubuntu-latest
    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Instalar FFmpeg y rclone"
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg rclone

      - name: "Configurar rclone"
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          fi

      - name: "Descargar Artefacto Bloque 1"
        uses: actions/download-artifact@v4
        with:
          name: "bloque1-audio"
          path: partes_descargadas

      - name: "Descargar Artefacto Bloque 2"
        uses: actions/download-artifact@v4
        with:
          name: "bloque2-audio"
          path: partes_descargadas

      - name: "Unir partes y generar MP4 unificado final"
        run: |
          chmod +x scripts/merge_parts.sh
          cd partes_descargadas
          SHOW_NAME="${{ inputs.show_name || 'LA ZONA ZONA WEEKEND CLASICOS DEL REGGAETON' }}"
          COVER_URL="https://raw.githubusercontent.com/jordantfarfan-cmd/radios-imagenes/main/${SHOW_NAME// /%20}.png"
          ../scripts/merge_parts.sh "$SHOW_NAME" "$COVER_URL" "Grabaciones_Radio/La_Zona"

      - name: "Subir copia de seguridad como Artefacto (1 día)"
        uses: actions/upload-artifact@v4
        with:
          name: "Backup_Show_Extendido"
          path: partes_descargadas/*.mp4
          retention-days: 1
          if-no-files-found: ignore
