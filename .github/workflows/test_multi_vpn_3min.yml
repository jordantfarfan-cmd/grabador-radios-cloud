name: "Prueba Simultánea - 8 Radios (3 Minutos con VPN)"

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Duración simultánea en segundos (180 = 3 min)'
        required: false
        default: '180'

jobs:
  record_all_simultaneous:
    name: "8 Radios Simultáneas (1 Conexión VPN)"
    runs-on: ubuntu-latest
    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Instalar FFmpeg, rclone y Wireproxy"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          curl -sSL -o wireproxy.tar.gz "https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz"
          tar -xzf wireproxy.tar.gz
          chmod +x wireproxy
          sudo mv wireproxy /usr/local/bin/wireproxy
          rm -f wireproxy.tar.gz

      - name: "Configurar rclone (si existe el Secret)"
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          fi

      - name: "Conectar ProtonVPN y grabar las 8 radios en paralelo"
        env:
          PROTON_WG_CONF: ${{ secrets.PROTON_WG_CONF }}
        run: |
          if [ -z "$PROTON_WG_CONF" ]; then
            echo "ERROR: Falta configurar el Secret PROTON_WG_CONF en GitHub."
            exit 1
          fi

          python3 - << 'EOF'
          import os
          conf = os.environ["PROTON_WG_CONF"]
          lines = []
          for line in conf.splitlines():
              s = line.strip()
              if not s or s.startswith("#") or s.startswith("MTU") or s.startswith("PersistentKeepalive"):
                  continue
              if s.startswith("Address"):
                  parts = [p.strip() for p in s.split("=", 1)[1].split(",") if ":" not in p]
                  lines.append("Address = " + ", ".join(parts))
              elif s.startswith("AllowedIPs"):
                  lines.append("AllowedIPs = 0.0.0.0/0")
              else:
                  lines.append(s)
          lines.append("PersistentKeepalive = 25")
          lines.append("")
          lines.append("[http]")
          lines.append("BindAddress = 127.0.0.1:8080")
          with open("wireproxy.conf", "w") as f:
              f.write("\n".join(lines) + "\n")
          EOF

          wireproxy -c wireproxy.conf > wireproxy.log 2>&1 &
          WP_PID=$!
          trap "kill $WP_PID 2>/dev/null || true" EXIT
          sleep 3

          echo "--> Verificando IP del túnel VPN:"
          curl -sS --max-time 15 -x http://127.0.0.1:8080 https://ipinfo.io/json || (cat wireproxy.log && exit 1)
          echo ""

          chmod +x scripts/record_radio.sh
          mkdir -p logs
          DUR="${{ inputs.duration_seconds || '180' }}"
          COVERS="https://raw.githubusercontent.com/jordantfarfan-cmd/radios-imagenes/main"

          echo "--> Lanzando las 8 grabaciones en paralelo por ${DUR} segundos..."

          # Las 7 emisoras de Mediastream pasan por el túnel VPN (Rumanía)
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "MODA EL JUERGON DE MODA" "https://mdstrm.com/audio/6839e1c82cc4c480fcd318dd/live.m3u8?dnt=true" "$COVERS/MODA%20EL%20JUERGON%20DE%20MODA.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/moda.log 2>&1 &
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "PLANETA PLANETA WEEKEND" "https://mdstrm.com/audio/6839e274f40e6b9832e37633/live.m3u8?dnt=true" "$COVERS/PLANETA%20PLANETA%20WEEKEND.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/planeta.log 2>&1 &
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "ONDA CERO LA TOCADA" "https://mdstrm.com/audio/6598b65ab398c90871aff8cc/live.m3u8?dnt=true" "$COVERS/ONDA%20CERO%20LA%20TOCADA.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/ondacero.log 2>&1 &
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "PANAMERICANA PANAMIX" "https://mdstrm.com/audio/6598b62dded1380470f4e539/live.m3u8?dnt=true" "$COVERS/PANAMERICANA%20PANAMIX.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/panamericana.log 2>&1 &
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "STUDIO SESSIONS" "https://mdstrm.com/audio/5fada553978fe1080e3ac5ea/live.m3u8?dnt=true" "$COVERS/STUDIO%20SESSIONS.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/studio.log 2>&1 &
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "LA ZONA ZONA WEEKEND" "https://mdstrm.com/audio/5fada54116646e098d97e6a5/live.m3u8?dnt=true" "$COVERS/LA%20ZONA%20ZONA%20WEEKEND.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/lazona.log 2>&1 &
          STREAM_HTTP_PROXY="http://127.0.0.1:8080" ./scripts/record_radio.sh "OXIGENO BAR OXIGENO" "https://mdstrm.com/audio/5fab0687bcd6c2389ee9480c/live.m3u8?dnt=true" "$COVERS/OXIGENO%20BAR%20OXIGENO.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/oxigeno.log 2>&1 &

          # Viva FM (TuPanel directo sin anuncios DAI)
          ./scripts/record_radio.sh "VIVA FM FIESTA PRIVADA" "https://tupanel.info:8780/stream" "$COVERS/VIVA%20FM%20FIESTA%20PRIVADA.png" "$DUR" "Grabaciones_Radio/Pruebas" > logs/viva.log 2>&1 &

          echo "--> Esperando a que las 8 radios terminen de grabar y empaquetar..."
          wait

          echo "--> Resumen de resultados:"
          for f in logs/*.log; do
            echo "=== $f ==="
            tail -n 5 "$f"
          done
          ls -lh temp_*/*.mp4 || true

      - name: "Subir los 8 MP4 generados como Artefacto (1 día)"
        uses: actions/upload-artifact@v4
        with:
          name: "Muestras_8_Radios_Simultaneas"
          path: temp_*/*.mp4
          retention-days: 1
          if-no-files-found: ignore
