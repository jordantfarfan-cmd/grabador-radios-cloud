name: "Prueba 3 Minutos - HLS Anti-Anuncios (Moda y La Zona)"

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Duración de la prueba en segundos'
        required: false
        default: '180'

jobs:
  test_hls_clean:
    name: "Test HLS: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MODA EL JUERGON DE MODA"
            url: "https://mdstrm.com/audio/6839e1c82cc4c480fcd318dd/live.m3u8?dnt=true"
            cover: "https://raw.githubusercontent.com/jordantfarfan-cmd/radios-imagenes/main/MODA%20EL%20JUERGON%20DE%20MODA.png"
          - name: "LA ZONA ZONA WEEKEND"
            url: "https://mdstrm.com/audio/5fada54116646e098d97e6a5/live.m3u8?dnt=true"
            cover: "https://raw.githubusercontent.com/jordantfarfan-cmd/radios-imagenes/main/LA%20ZONA%20ZONA%20WEEKEND.png"

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Instalar FFmpeg y rclone"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone

      - name: "Configurar rclone (si existe el Secret)"
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
            echo "rclone configurado exitosamente."
          else
            echo "Aviso: Secret RCLONE_CONFIG no encontrado. El MP4 quedará como Artefacto descargable en GitHub."
          fi

      - name: "Ejecutar grabación HLS (3 minutos)"
        run: |
          chmod +x scripts/record_radio.sh
          DUR="${{ inputs.duration_seconds || '180' }}"
          ./scripts/record_radio.sh "${{ matrix.name }}" "${{ matrix.url }}" "${{ matrix.cover }}" "$DUR" "Grabaciones_Radio/Pruebas"

      - name: "Subir muestra MP4 como Artefacto (1 día)"
        uses: actions/upload-artifact@v4
        with:
          name: "Muestra_3min_${{ matrix.name }}"
          path: temp_*/*.mp4
          retention-days: 1
          if-no-files-found: ignore
